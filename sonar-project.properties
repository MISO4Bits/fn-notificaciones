# Configuración de SonarQube Cloud (DI-005). Ajusta sonar.organization
# y sonar.projectKey con los valores exactos que muestra "Configure
# analysis" dentro del proyecto en sonarcloud.io si difieren de estos.
sonar.organization=miso4bits
sonar.projectKey=MISO4Bits_fn-notificaciones

sonar.sources=app
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

# Mismo criterio que [tool.coverage.run].omit en pyproject.toml: código que
# solo se ejerce con credenciales/infraestructura real de GCP, fuera del
# alcance de las pruebas locales — sin esto, Sonar mide cobertura sobre
# líneas que pytest nunca pretendió cubrir y el gate de "Coverage on New
# Code" falla en cualquier PR que toque estos archivos.
sonar.coverage.exclusions=app/main.py

# Hace que el paso del escáner espere el resultado del quality gate y
# falle si no pasa — sin esto, el job "sonar" solo sube el análisis y
# queda en verde aunque el gate falle (DI-006: sonar es required check).
sonar.qualitygate.wait=true
