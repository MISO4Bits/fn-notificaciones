openapi: 3.2.0
info:
  title: fn-notificaciones — envío de correos
  version: 0.1.0
  summary: Función serverless (Cloud Run) que envía los correos electrónicos de Solventa.
  description: |
    Una suscripción *push* de Pub/Sub, filtrada por `tipo = EnviarCorreo`, entrega aquí cada
    mensaje. La función **no decide nada**: el asunto y los dos cuerpos (HTML y texto) llegan
    ya rellenados por quien publica el evento (hoy CoreTransaccional, con la plantilla que
    sirve Productos y Configuración de Mercado) y solo se entregan al proveedor de correo.

    **Quién publica:** CoreTransaccional (`bienvenida` y `verificacion-correo` del registro,
    BITS-93). Cualquier componente puede publicar `EnviarCorreo` para un correo nuevo.

    **Confirmación de mensajes (cómo reacciona Pub/Sub):**
    - `204`: el correo salió, o el mensaje no tiene arreglo (mal formado, rechazado por el
      proveedor) y se descarta con un error en el log. Pub/Sub lo da por entregado.
    - `503`: el envío falló tras varios intentos por algo transitorio (proveedor caído, límite
      de tasa, credenciales). Pub/Sub lo reentrega con espera creciente.

    **Trazabilidad:** el `traceparent` (W3C) viaja en los atributos del mensaje; el envío queda
    en el mismo trace que el registro que lo originó.

    **Duplicados:** Pub/Sub entrega *al menos una vez*. El `id` del evento se envía al
    proveedor como clave de idempotencia, así una reentrega no manda el correo dos veces.

servers:
  - url: https://fn-notificaciones.internal
    description: Cloud Run, sin acceso público (solo la cuenta de servicio de la suscripción).

tags:
  - name: Pub/Sub
    description: Entrada de la suscripción push.

paths:
  /:
    post:
      operationId: recibirMensaje
      tags: [Pub/Sub]
      summary: Recibe un mensaje de la suscripción push y envía el correo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SobrePush' }
      responses:
        '204':
          description: Mensaje confirmado (correo enviado o mensaje descartado sin arreglo).
        '503':
          description: El envío falló; Pub/Sub debe reentregar el mensaje.

  /push:
    post:
      operationId: recibirAvisoPush
      tags: [Pub/Sub]
      summary: Recibe un mensaje de la suscripción push de avisos y lo entrega al teléfono
      description: |
        Una suscripción *push* de Pub/Sub filtrada por `tipo = EnviarPush` entrega aquí cada
        aviso. La función lo entrega por Firebase Cloud Messaging, un mensaje por dispositivo.

        Un token que Firebase ya no conoce (`UNREGISTERED`) o un rechazo definitivo
        (`INVALID_ARGUMENT`) se anotan y se confirma el mensaje: reintentar no los arregla, y no
        deben impedir que los demás dispositivos reciban el aviso. Un fallo transitorio (límite,
        proveedor caído, permisos pendientes) se reintenta y, si se agotan los intentos, responde
        `503` para que Pub/Sub reentregue; la etiqueta del aviso (el `id` del evento) hace que el
        teléfono reemplace el aviso en vez de mostrarlo dos veces.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SobrePush' }
      responses:
        '204':
          description: Mensaje confirmado (aviso entregado o descartado sin arreglo).
        '503':
          description: La entrega falló; Pub/Sub debe reentregar el mensaje.

components:
  schemas:
    SobrePush:
      description: Sobre estándar de una suscripción push de Pub/Sub.
      type: object
      required: [message]
      properties:
        subscription: { type: string }
        message:
          type: object
          required: [data]
          properties:
            data:
              type: string
              contentEncoding: base64
              description: El evento `EnviarCorreo` en JSON, codificado en base64.
            attributes:
              type: object
              additionalProperties: { type: string }
              description: Incluye `tipo` y el `traceparent` de la traza.
            messageId: { type: string }

    EventoEnviarCorreo:
      description: Contenido de `message.data` (una vez decodificado).
      type: object
      required: [tipo, datos]
      properties:
        tipo: { type: string, const: EnviarCorreo }
        id:
          type: string
          description: Identificador único del evento; se usa como clave de idempotencia.
        ocurridoEn: { type: string, format: date-time }
        datos: { $ref: '#/components/schemas/DatosEnviarCorreo' }
      examples:
        - tipo: EnviarCorreo
          id: 3f2b8a52-6c0e-4d8e-9a7e-1c5d2f9b7a10
          ocurridoEn: '2026-10-08T21:30:00Z'
          datos:
            destinatario: ana.rios@example.com
            plantilla: verificacion-correo
            plantillaVersion: V1
            clienteId: 7b1d3c2e-0f4a-4b8e-9c55-2a1e6d9f0b34
            asunto: Confirma tu correo en Solventa
            cuerpoHtml: '<p>Hola Ana</p><a href="https://solventa4bits.com/verificar-correo?oobCode=AbCd">Confirmar</a>'
            cuerpoTexto: 'Hola Ana: https://solventa4bits.com/verificar-correo?oobCode=AbCd'

    DatosEnviarCorreo:
      type: object
      required: [destinatario, asunto, cuerpoHtml, cuerpoTexto, plantilla]
      properties:
        destinatario: { type: string, format: email, maxLength: 254 }
        asunto:
          type: string
          minLength: 1
          maxLength: 998
          pattern: '^[^\r\n]+$'
          description: Una sola línea (es un encabezado de correo).
        cuerpoHtml: { type: string, minLength: 1 }
        cuerpoTexto: { type: string, minLength: 1 }
        plantilla:
          type: string
          maxLength: 64
          description: Nombre de la plantilla de origen; solo para trazabilidad.
        plantillaVersion: { type: string, description: Versión de la plantilla de origen. }
        clienteId: { type: string, maxLength: 64 }
        adjuntos:
          type: array
          maxItems: 3
          description: |
            Archivos que ya están en el bucket de adjuntos (`FN_ADJUNTOS_BUCKET`) y deben viajar
            con el correo, por ejemplo el PDF de la póliza. La función los lee y los adjunta; el
            evento solo lleva la referencia. Si el bucket no es el permitido el mensaje se
            descarta; si el archivo todavía no está o no hay bucket configurado, se reentrega.
          items:
            type: object
            required: [nombre, bucket, objeto]
            properties:
              nombre: { type: string, maxLength: 120, description: 'Nombre con el que llega el archivo, sin rutas.' }
              bucket: { type: string }
              objeto: { type: string, description: 'Ruta del archivo en el bucket.' }
              contentType: { type: string, default: application/pdf }

    EventoEnviarPush:
      description: Contenido de `message.data` (una vez decodificado) en la ruta `/push`.
      type: object
      required: [tipo, datos]
      properties:
        tipo: { type: string, const: EnviarPush }
        id:
          type: string
          description: Identificador único del evento; es la etiqueta del aviso en el teléfono.
        ocurridoEn: { type: string, format: date-time }
        datos: { $ref: '#/components/schemas/DatosEnviarPush' }
      examples:
        - tipo: EnviarPush
          id: 8c1f6a52-6c0e-4d8e-9a7e-1c5d2f9b7a10
          ocurridoEn: '2026-10-30T15:04:05Z'
          datos:
            clienteId: 7b1d3c2e-0f4a-4b8e-9c55-2a1e6d9f0b34
            tokens: ['fcm-token-del-telefono-1']
            titulo: Tu póliza ya está activa
            cuerpo: Ya puedes ver tu seguro y descargar el documento.
            ruta: { destino: seguro, id: 0c9a3a52-6c0e-4d8e-9a7e-1c5d2f9b7a10 }
            prioridad: alta

    DatosEnviarPush:
      type: object
      required: [tokens, titulo, cuerpo, ruta]
      properties:
        clienteId: { type: string, maxLength: 64 }
        tokens:
          type: array
          minItems: 1
          maxItems: 5
          description: Tokens de Firebase de los dispositivos del cliente. Nunca se registran completos.
          items: { type: string, pattern: '^\S+$' }
        titulo:
          type: string
          minLength: 1
          maxLength: 65
          pattern: '^[^\r\n]+$'
          description: Una sola línea. Sin montos ni datos de la póliza (se ve con el teléfono bloqueado).
        cuerpo:
          type: string
          minLength: 1
          maxLength: 240
        ruta:
          type: object
          required: [destino, id]
          description: Qué abre la app al tocar el aviso.
          properties:
            destino: { type: string, enum: [seguro], description: 'Lista cerrada de pantallas.' }
            id: { type: string, minLength: 1, maxLength: 64, description: 'Identificador del recurso (la póliza).' }
        prioridad: { type: string, enum: [alta, normal], default: alta }
